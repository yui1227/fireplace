<html lang="zh-Hant">
<head>
<meta charset="utf-8">

  #ui input[type=checkbox]{accent-color:#e8813a;width:18px;height:18px}
  #panel{display:flex;flex-direction:column;gap:10px;padding:4px 2px 10px;margin-bottom:8px;border-bottom:1px solid rgba(255,190,130,.15);min-width:260px}

  #panel .row{display:flex;align-items:center;justify-content:space-between;gap:12px}

  #panel .seg{display:flex;gap:4px} #panel .seg button.on{background:rgba(232,129,58,.35);border-color:#e8813a}
  #panel select{background:#2a1a12;color:inherit;border:1px solid rgba(255,190,130,.3);border-radius:8px;padding:4px 6px;font:inherit}
  #panel .bar{flex:1;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden} #panel .bar i{display:block;height:100%;background:linear-gradient(90deg,#b8401a,#f0a040)}
  #panel .hint{font-size:11px;opacity:.7}
  body.idle #ui{opacity:0} body.idle{cursor:none}
</style>
</head>

<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<div id="ui">
  <div id="panel" hidden>
    <div class="row"><span>畫質</span><span class="seg"><button data-q="low">低</button><button data-q="mid">中</button><button data-q="high">高</button></span></div>

<script>
(() => {
'use strict';
/* ---------- 全場景 3D 光線步進 ---------- */
const COMMON = `#version 300 es
precision highp float;precision highp int;
float h1(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
vec2 h2(vec2 p){float n=h1(p);return vec2(n,h1(p+n*17.13+3.1));}
float noise(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
 return mix(mix(h1(i),h1(i+vec2(1,0)),u.x),mix(h1(i+vec2(0,1)),h1(i+vec2(1,1)),u.x),u.y);}
vec3 enc(vec3 c){c=clamp(c,0.,6e4);return max(pow(c/(1.+c),vec3(1./2.2))+(h1(gl_FragCoord.xy*.913+fract(c.r*91.7))-.5)/255.,0.);}

`;
const VS3 = `#version 300 es
in vec2 p;out vec2 vUv;void main(){vUv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const SCENE_FS = COMMON + `out vec4 o;
uniform int ZERO;uniform vec2 R,JIT;uniform float T,I,FL,FT,FUEL,STEPS,MOON,SMK;uniform vec3 CAM,TGT;uniform vec4 NL;
float gFP=.001;
float df(float fr){return smoothstep(.45,.12,fr*gFP);}
#define HP .6
#define SW .74
#define SH 1.12
#define SD .34
float h13(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float n3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
 return mix(mix(mix(h13(i),h13(i+vec3(1,0,0)),f.x),mix(h13(i+vec3(0,1,0)),h13(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(h13(i+vec3(0,0,1)),h13(i+vec3(1,0,1)),f.x),mix(h13(i+vec3(0,1,1)),h13(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm3(vec3 p){float v=0.,a=.5;for(int i=ZERO;i<4;i++){v+=a*n3(p);p=p*2.03+vec3(1.3,7.1,4.7);a*=.5;}return v;}
vec3 voro(vec2 x){vec2 n=floor(x),f=fract(x);float d1=8.,d2=8.;vec2 id=vec2(0);
 for(int j=-1+ZERO;j<=1;j++)for(int i=-1+ZERO;i<=1;i++){vec2 g=vec2(i,j);vec2 o=h2(n+g)*.8+.1;vec2 r=g+o-f;float d=dot(r,r);
  if(d<d1){d2=d1;d1=d;id=n+g;}else if(d<d2)d2=d;}
 return vec3(sqrt(d2)-sqrt(d1),h1(id),h1(id+7.7));}
vec3 ember(float t){t=clamp(t,0.,2.);return vec3(1.,.15+.42*t,.02+.16*t*t)*t;}
float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}
void logDef(int i,out vec3 a,out vec3 b,out float r){
 if(i==0){a=vec3(-.4,.085,.35);b=vec3(.41,.095,.32);r=.08;}
 else if(i==1){a=vec3(-.37,.072,.1);b=vec3(.35,.068,.13);r=.07;}
 else if(i==2){a=vec3(-.3,.075,.04);b=vec3(.12,.22,.36);r=.058;}
 else if(i==3){a=vec3(.31,.072,.05);b=vec3(-.1,.23,.35);r=.056;}
 else if(i==4){a=vec3(-.17,.215,.2);b=vec3(.21,.19,.25);r=.046;}
 else{a=vec3(-.3,.3+NL.y,.16);b=vec3(.31,.285+NL.y,.22);r=.058*mix(.65,1.,NL.w);return;}
 float sh=mix(.6,1.,FUEL);float dy=(1.-FUEL)*r*.45;r*=sh;a.y-=dy;b.y-=dy;}
float sdCyl(vec3 p,vec3 a,vec3 b,float r){
 vec3 ba=b-a,pa=p-a;float baba=dot(ba,ba),paba=dot(pa,ba);
 float x=length(pa*baba-ba*paba)-r*baba,y=abs(paba-baba*.5)-baba*.5;
 float x2=x*x,y2=y*y*baba;
 float d=(max(x,y)<0.)?-min(x2,y2):(((x>0.)?x2:0.)+((y>0.)?y2:0.));
 return sign(d)*sqrt(abs(d))/baba;}
float cavity(vec3 p){float zc=max(p.z,0.);
 return max(max(-p.y,p.y-(HP+.25*zc)),max(abs(p.x)-(.5-.3*zc),max(-(p.z+.4),p.z-.46)));}
// 材質：0-4 木柴, 5 爐體, 6 金屬框, 7 爐床, 8 地板, 9 牆
#define MY .93
float sdVC(vec3 p,float r,float h){vec2 d=vec2(length(p.xz)-r,abs(p.y-h*.5)-h*.5);return min(max(d.x,d.y),0.)+length(max(d,0.));}
// 材質：0-4 木柴, 5 爐體, 6 金屬框, 7 爐床, 8 地板, 9 磚牆, 10 壁爐台, 11 柵欄, 12 地毯, 13 蠟燭, 14 花瓶, 15 備用柴, 16 掛畫
vec2 map(vec3 p){
 vec2 res=vec2(p.y+.09,8.);
 float w=SD-.02-p.z; if(w<res.x)res=vec2(w,9.);
 float mass=sdBox(p-vec3(0.,1.45,SD*.5-.02),vec3(SW,1.54,SD*.5))-.006;
 float cav=cavity(p);
 float sur=max(mass,-cav); if(sur<res.x)res=vec2(sur,5.);
 float fr=max(sdBox(p-vec3(0.,HP*.5,-.03),vec3(.56,HP*.5+.05,.018))-.004,-cav);
 if(fr<res.x)res=vec2(fr,6.);
 float hr=sdBox(p-vec3(0.,-.05,-.12),vec3(SW+.08,.04,.16))-.004; if(hr<res.x)res=vec2(hr,7.);
 float mt=sdBox(p-vec3(0.,MY,.04),vec3(SW+.1,.03,.14))-.008; if(mt<res.x)res=vec2(mt,10.);
 float db=sdBox(p-vec3(0.,MY+.3,-.04),vec3(SW,.3,.1));
 if(db<res.x){
  vec3 q=p-vec3(.5,MY+.038,.0);
  float body=(length((q-vec3(0.,.085,0.))/vec3(.068,.09,.068))-1.)*.06;
  float neck=sdVC(q-vec3(0.,.14,0.),.026,.09);
  float vs=min(body,neck)-.002; vs=max(vs,-sdVC(q-vec3(0.,.17,0.),.02,.1));
  if(vs<res.x)res=vec2(vs,14.);
  float pic=sdBox(p-vec3(0.,MY+.36,-.034),vec3(.34,.21,.012))-.003; if(pic<res.x)res=vec2(pic,16.);
 }
 float sb=sdBox(p-vec3(0.,.14,-.18),vec3(.63,.17,.1));
 if(sb<res.x){
  // 弧形柵欄：圓心在爐內，半徑 FR
  const float FR=1.131,FZ=.871,HA=.54;
  vec2 dd=p.xz-vec2(0.,FZ);float rr=length(dd);float an=atan(dd.x,-dd.y);
  float sa=an*FR,dr=rr-FR,y=p.y;
  float lim=abs(an)-HA;
  float bx=sa-.045*clamp(floor(sa/.045+.5),-13.,13.);
  float bars=max(length(vec2(bx,dr))-.0055,abs(y-.125)-.135);
  float r1=max(length(vec2(y-.235,dr))-.01,lim*FR);
  float r2=max(length(vec2(y-.045,dr))-.008,lim*FR);
  float ft=max(max(abs(dr)-.03,abs(y+.004)-.006),lim*FR-.01);
  float fin=max(length(vec3(bx,y-.27,dr))-.012,lim*FR);
  float scr=min(min(bars,min(r1,r2)),min(ft,fin))*.9;
  if(scr<res.x)res=vec2(scr,11.);
 }
 float rg=sdBox(p-vec3(0.,-.087,-.98),vec3(.9,.004,.46))-.002; if(rg<res.x)res=vec2(rg,12.);
 float wb=sdBox(p-vec3(1.16,.12,-.12),vec3(.25,.24,.25));
 if(wb<res.x){
  for(int i=ZERO;i<6;i++){float fi=float(i);
   vec2 c=i<3?vec2(1.0+fi*.135,-.025):(i<5?vec2(1.07+(fi-3.)*.135,.095):vec2(1.135,.21));
   float rr=.062+.006*sin(fi*3.7);
   float d=sdCyl(p,vec3(c.x,c.y,-.32+.03*sin(fi*2.1)),vec3(c.x,c.y,.06-.03*cos(fi*1.3)),rr-.006)-.006;
   if(d<res.x)res=vec2(d,15.);}
 }
 float fb=sdBox(p-vec3(0.,.17+max(NL.y,0.)*.5,.22),vec3(.5,.22+max(NL.y,0.)*.5,.28));
 if(fb<res.x){
  for(int i=ZERO;i<5;i++){vec3 a,b;float r;logDef(i,a,b,r);
   float d=sdCyl(p,a,b,r-.01)-.01;
   d-=.003*sin(p.x*70.+p.z*55.)*sin(p.y*60.+p.x*20.);
   if(d<res.x)res=vec2(d,float(i));}
  if(NL.x>.5){vec3 a,b;float r;logDef(5,a,b,r);float d=sdCyl(p,a,b,r-.01)-.01;if(d<res.x)res=vec2(d,17.);}}
 return res;}
vec3 calcN(vec3 p){vec3 n=vec3(0.);
 for(int i=ZERO;i<4;i++){vec3 e=.5773*(2.*vec3(float(((i+3)>>1)&1),float((i>>1)&1),float(i&1))-1.);n+=e*map(p+.0012*e).x;}
 return normalize(n);}
vec3 LP(){return vec3(.04*sin(T*1.7)+.02*sin(T*4.1),.27+.025*sin(T*2.3),.23);}
float LI(){return (1.1+.5*FL)*I*(.9+.2*noise(vec2(T*9.,1.)));}
float shadow(vec3 p,vec3 l){vec3 d=l-p;float L=length(d);d/=L;float res=1.,t=.015;
 for(int i=ZERO;i<20;i++){float h=map(p+d*t).x;res=min(res,9.*h/t);t+=clamp(h,.008,.08);if(res<.02||t>L)break;}
 return clamp(res,0.,1.);}
// 爐膛內照明
vec3 lightIn(vec3 p,vec3 n,float sh){
 vec3 l=LP()-p;float d2=dot(l,l);l=normalize(l);
 vec3 c=vec3(1.,.42,.13)*LI()*max(dot(n,l),0.)/(1.+20.*d2)*sh*1.6;
 vec3 l2=vec3(0.,.03,.23)-p;float e2=dot(l2,l2);
 c+=vec3(1.,.3,.07)*.55*I*max(dot(n,normalize(l2)),0.)/(1.+45.*e2);
 return c+vec3(1.,.35,.1)*.015*I;}
// 房間照明：火光從爐口往外打
float shadowL(vec3 p,vec3 l,float k){vec3 d=l-p;float L=length(d);d/=L;float res=1.,t=.02;
 for(int i=ZERO;i<18;i++){float h=map(p+d*t).x;res=min(res,k*h/t);t+=clamp(h,.02,.3);if(res<.02||t>L-.05)break;}
 return clamp(res,0.,1.);}
vec3 lightRoom(vec3 p,vec3 n,vec3 rd,float gloss){
 vec3 o=vec3(.02*sin(T*1.7),.26,-.05);vec3 lo=o-p;float d2=dot(lo,lo);float dl=sqrt(d2);vec3 ld=lo/dl;
 float emit=clamp(-(p.z-o.z)/dl*1.3,0.,1.);
 float fl=LI();
 float fs=1.;if(p.z<-.06&&emit>0.&&d2<3.)fs=shadowL(p+n*.003,o,14.);
 vec3 c=vec3(1.,.43,.15)*fl*.55*max(dot(n,ld),0.)*emit/(1.+1.2*d2)*fs;
 vec3 hv=normalize(ld-rd);c+=vec3(1.,.5,.2)*fl*gloss*pow(max(dot(n,hv),0.),40.)*emit/(1.+1.2*d2)*fs;
 vec3 bo=vec3(0.,.4,-.6)-p;float bd=dot(bo,bo);
 c+=vec3(1.,.5,.25)*fl*.05*(.55+.45*max(dot(n,normalize(bo)),0.))/(1.+.35*bd);
 c+=vec3(.013,.013,.016)*(.6+.4*n.y);
 if(MOON>0.){
  vec3 ML=normalize(vec3(-.84,.52,-.12));
  float nm=max(dot(n,ML),0.);
  if(nm>0.){float tw=(-2.4-p.x)/ML.x;vec2 w=vec2(p.z+ML.z*tw,p.y+ML.y*tw);
   vec2 wc=w-vec2(-1.27,1.5);
   float m=smoothstep(.04,0.,max(abs(wc.x)-.4,abs(wc.y)-.55));
   m*=smoothstep(.012,.03,abs(wc.x))*smoothstep(.012,.03,abs(wc.y))*smoothstep(.01,.025,abs(wc.y-.28))*smoothstep(.01,.025,abs(wc.y+.28));
   if(m>0.)m*=shadowL(p+n*.003,p+ML*2.5,16.);
   c+=vec3(.42,.56,.95)*MOON*.16*m*(nm+gloss*.8*pow(max(dot(n,normalize(ML-rd)),0.),40.));}
  c+=vec3(.006,.009,.018)*MOON*(.5+.5*n.y);}
 return c;}
vec3 bricks(vec2 uv,float s){
 vec2 bp=uv*vec2(1./.21,1./.068);float row=floor(bp.y);bp.x+=mod(row,2.)*.5;vec2 f=fract(bp);
 float ex=max(.035,1.2*gFP/.21),ey=max(.1,1.2*gFP/.068);
 float g=smoothstep(0.,ex,f.x)*smoothstep(1.,1.-ex,f.x)*smoothstep(0.,ey,f.y)*smoothstep(1.,1.-ey,f.y);
 g=mix(g,.85,smoothstep(.4,1.,gFP/.068*4.));
 vec3 b=vec3(.36,.12,.065)*(.6+.55*h1(floor(bp)))*s;
 return mix(vec3(.05,.042,.036),b,g)*(1.+(.2*noise(uv*70.)-.1)*df(70.))*(1.+(.24*noise(uv*300.)-.12)*df(300.));}
void matLog(vec3 p,float fid,vec3 n,out vec3 A,out vec3 E){
 vec3 a,b;float r;int id=int(fid+.5);logDef(id,a,b,r);
 float ch=id==5?NL.z:1.;
 vec3 ba=b-a;float len=length(ba);vec3 dir=ba/len;
 float al=dot(p-a,dir);vec3 rel=p-a-dir*al;
 vec3 u=normalize(cross(dir,vec3(0,1,0)));vec3 v=cross(u,dir);
 float ang=atan(dot(rel,v),dot(rel,u));float rad=length(rel)/r;
 vec3 hp=(p-vec3(0.,.15,.22))*vec3(2.6,3.6,4.);float hf=exp(-dot(hp,hp));
 float down=clamp(.5-.6*n.y,0.,1.);
 A=vec3(0.);E=vec3(0.);
 if(al<.008||al>len-.008){
  vec3 vr=voro(vec2(rad*6.,ang*2.5+fid*5.));
  float rings=.5+.5*sin(rad*38.+noise(vec2(ang*3.,rad*8.))*4.);
  vec3 alb=mix(vec3(.05,.03,.018),vec3(.11,.065,.035),rings)*(1.-.6*smoothstep(.55,1.,rad));
  if(ch<.6)alb=mix(vec3(.33,.24,.14)*(.8+.2*rings),alb,ch/.6);
  A=alb;
  float rim=smoothstep(.75,1.,rad)*hf*ch;
  E=ember(rim*(.6+.6*noise(vec2(ang*4.,T*.5))))*(1.-smoothstep(0.,.06,vr.x))*1.4+ember(rim*.35)*.4;
 }else{
  vec2 sc=vec2(al*.75,ang*r)/(r*.55)+fid*7.;
  sc+=(vec2(noise(sc*.7),noise(sc*.7+9.))-.5)*.9;
  vec3 vr=voro(sc);float edge=vr.x;
  float bump=smoothstep(.02,.3,edge);
  float tn=noise(vec2(vr.y*50.+T*(.25+.5*vr.z),vr.z*30.));
  float heat=hf*(.25+.95*down)*(.3+.9*tn)*(.65+.35*I+.35*FL)*ch*mix(.55,1.,FUEL);
  float crack=1.-smoothstep(0.,.03+.12*heat*heat,edge);
  vec3 alb=vec3(.03,.025,.022)*(.35+.9*bump)*(.75+.5*noise(sc*vec2(5.,1.3)));
  alb+=vec3(.16,.15,.14)*smoothstep(.82-.35*(1.-FUEL),.97,vr.z)*smoothstep(.1,.6,n.y)*bump;
  vec3 bark=vec3(.16,.1,.06)*(.55+.6*noise(vec2(al*30.,ang*6.)))*(.7+.5*noise(vec2(al*4.,ang*20.)));
  alb=mix(bark,alb,smoothstep(0.,.6,ch));
  A=alb*(.5+.5*bump);
  E=ember(heat*1.3)*crack*1.6+ember(heat*.45)*smoothstep(.6,.95,tn)*down*(1.-bump*.6)*.6;
 }}
void matInterior(vec3 p,vec3 n,out vec3 A,out vec3 E){
 E=vec3(0.);
 if(n.y>.7){
  vec2 uv=p.xz;
  vec3 alb=vec3(.085,.08,.075)*(.55+.7*noise(uv*35.))*(.7+.3*mix(.5,noise(uv*180.),df(180.)));
  vec2 ep=uv*17.;ep+=(vec2(noise(ep*.5),noise(ep*.5+5.))-.5)*1.3;
  vec3 v=voro(ep);float lump=smoothstep(0.,.22,v.x);
  vec2 dq=vec2(p.x/.3,(p.z-.23)/.15);float hx=exp(-dot(dq,dq));
  float ht=hx*(.35+.8*noise(vec2(v.y*40.,T*.35+v.z*9.)))*(.65+.35*I+.3*FL);
  float coal=step(.25,hx*(.4+v.z));
  A=mix(alb,vec3(.02,.017,.015)*(.5+lump),coal);E=coal*(ember(ht*1.2)*(1.-lump)*1.3+ember(ht*.4)*lump*.3);return;}
 vec2 uv=abs(n.z)>.6?p.xy:vec2(p.z*sign(p.x),p.y);
 vec3 alb=bricks(uv,.7);
 float soot=smoothstep(.0,.42,p.y)*(.7+.3*smoothstep(.5,.0,abs(p.x)));

 A=alb;}
void matExt(vec3 p,vec3 n,float m,out vec3 A,out vec3 E,out float G){
 E=vec3(0.);
 if(m>15.5){ // 掛畫
  vec2 q=(p.xy-vec2(0.,MY+.36))/vec2(.34,.21);
  float fr=step(.86,max(abs(q.x),abs(q.y)*1.08));
  if(fr>.5||n.z>-.5){vec3 alb=vec3(.22,.14,.06)*(.7+.4*noise(q*vec2(40.,3.)));{A=alb;G=.5;return;}}
  vec2 u=q*.5+.5;
  vec3 sky=mix(vec3(.55,.35,.25),vec3(.12,.16,.28),u.y);
  float hill=.45+.12*sin(u.x*5.+1.)+.05*sin(u.x*13.);float hill2=.3+.08*sin(u.x*4.+3.);

}
function project(Pt){
  const v=sub(Pt,CAM), z=dot(v,basis.f); if(z<=0.05) return null;
  const A=W/H, x=dot(v,basis.r)/(z*FT*A), y=dot(v,basis.u)/(z*FT);
  return [(x*0.5+0.5)*W, (0.5-y*0.5)*H, z];
}
function visible(Pt){
  if(Pt[2]<=0) return true;
  const v=sub(Pt,CAM), k=(0-CAM[2])/v[2], x=CAM[0]+v[0]*k, y=CAM[1]+v[1]*k;
  return Math.abs(x)<0.5 && y>0 && y<0.6;
}

/* ---------- WebGL ---------- */
let gl=null, GLX=null, useHalf=false, glReady=false, glFail='';
const msg=t=>{ let m=document.getElementById('msg'); if(!m){ m=document.createElement('div'); m.id='msg';
  m.style.cssText='position:fixed;inset:0;display:grid;place-items:center;color:#f3d3b0;font-size:15px;pointer-events:none;text-align:center;padding:20px'; document.body.appendChild(m); }
  m.textContent=t; m.style.display=t?'grid':'none'; };
function initGL(){
  gl=cv.getContext('webgl2',{antialias:false,alpha:false,premultipliedAlpha:false,powerPreference:'high-performance'});
  if(!gl){ glFail='這個瀏覽器不支援 WebGL2'; msg(glFail); return; }
  useHalf=!!gl.getExtension('EXT_color_buffer_float');
  const par=gl.getExtension('KHR_parallel_shader_compile');
  const progs=[];
  const sh=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;};
  const mk=(fs,names)=>{const p=gl.createProgram();const v=sh(gl.VERTEX_SHADER,VS3),f=sh(gl.FRAGMENT_SHADER,fs);
    gl.attachShader(p,v);gl.attachShader(p,f);gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);
    const o={p,v,f,names,u:{}};progs.push(o);return o;};
  GLX={ scene:mk(SCENE_FS,['ZERO','R','JIT','T','I','FL','FT','CAM','TGT','FUEL','STEPS','MOON','SMK','NL']),
        acc:mk(ACC_FS,['S','P','TX','AL']), bright:mk(BRIGHT_FS,['S','TX','TH']),
        blur:mk(BLUR_FS,['S','DIR']), comp:mk(COMP_FS,['S','B1','B2','T','R','HZ','HS']) };
  const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  msg('正在準備爐火…');
  // 在背景編譯著色器，不卡住頁面
  const finish=()=>{
    for(const o of progs){ if(!gl.getProgramParameter(o.p,gl.LINK_STATUS)){
      console.error(gl.getShaderInfoLog(o.f)||gl.getProgramInfoLog(o.p)); glFail='著色器編譯失敗'; msg(glFail); return; }
      for(const n of o.names) o.u[n]=gl.getUniformLocation(o.p,n); }
    glReady=true; msg(''); layout(); };
  const poll=()=>{ if(progs.every(o=>gl.getProgramParameter(o.p,par.COMPLETION_STATUS_KHR))) finish(); else setTimeout(poll,50); };
  if(par) poll(); else setTimeout(finish,0);
  cv.addEventListener('webglcontextlost',e=>{ e.preventDefault(); glReady=false; msg('顯示卡被重置了，請重新整理頁面'); });
}
function makeRT(w,h){
  const mkTex=half=>{ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
    if(half) gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);
    else gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    for(const [k,v] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D,k,v);
    const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
    return {t,f,ok:gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE}; };
  let r = useHalf ? mkTex(true) : null;
  if(!r || !r.ok){ if(r){ gl.deleteTexture(r.t); gl.deleteFramebuffer(r.f); } useHalf=false; r=mkTex(false); }
  return {t:r.t,f:r.f,w,h};
}
const freeRT=r=>{ if(r){ gl.deleteTexture(r.t); gl.deleteFramebuffer(r.f); } };
function layout(){
  W=innerWidth; H=innerHeight; dpr=Math.min(devicePixelRatio||1,2);
  fx.width=Math.round(W*dpr); fx.height=Math.round(H*dpr);
  setupCamera(performance.now()/1000);
  if(!gl||!glReady) return;
  const s=Math.min(dpr,QUAL[S.quality].cap)*glQ;
  cv.width=Math.max(4,Math.round(W*s)); cv.height=Math.max(4,Math.round(H*s));
  for(const k of ['rs','a0','a1','b1a','b1b','b2a','b2b']) freeRT(GLX[k]);
  const W1=Math.max(2,cv.width>>2), H1=Math.max(2,cv.height>>2);
  GLX.rs=makeRT(cv.width,cv.height); GLX.a0=makeRT(cv.width,cv.height); GLX.a1=makeRT(cv.width,cv.height);
  GLX.b1a=makeRT(W1,H1); GLX.b1b=makeRT(W1,H1);
  GLX.b2a=makeRT(Math.max(2,W1>>1),Math.max(2,H1>>1)); GLX.b2b=makeRT(Math.max(2,W1>>1),Math.max(2,H1>>1));
  GLX.fresh=true;
}
function pass(prog,target,setup){
  gl.useProgram(prog.p);
  if(target){ gl.bindFramebuffer(gl.FRAMEBUFFER,target.f); gl.viewport(0,0,target.w,target.h); }
  else { gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,cv.width,cv.height); }
  setup(prog.u); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
const bindTex=(u,unit,rt)=>{ gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,rt.t); gl.uniform1i(u,unit); };
const halton=(i,b)=>{let f=1,r=0;while(i>0){f/=b;r+=f*(i%b);i=Math.floor(i/b);}return r;};
let frameNo=0;
function renderGL(t,I,flare,fuel,NL,heat){
  if(!gl||!glReady||!GLX.rs) return; const X=GLX, tt=t%500; frameNo++;
  const jx=halton(frameNo%8+1,2)-0.5, jy=halton(frameNo%8+1,3)-0.5;
  pass(X.scene,X.rs,u=>{ gl.uniform1i(u.ZERO,0); gl.uniform2f(u.R,cv.width,cv.height); gl.uniform2f(u.JIT,jx,jy); gl.uniform1f(u.T,tt); gl.uniform1f(u.I,I); gl.uniform1f(u.FL,flare);
    gl.uniform1f(u.FT,FT); gl.uniform3f(u.CAM,CAM[0],CAM[1],CAM[2]); gl.uniform3f(u.TGT,TGT[0],TGT[1],TGT[2]);
    gl.uniform1f(u.FUEL,fuel); gl.uniform1f(u.STEPS,QUAL[S.quality].steps); gl.uniform1f(u.MOON,1); gl.uniform1f(u.SMK,1);
    gl.uniform4f(u.NL,NL[0],NL[1],NL[2],NL[3]); });
  const al = X.fresh ? 1 : Math.min(1, 0.14 + camMoved*6);
  X.fresh=false;
  pass(X.acc,X.a1,u=>{ bindTex(u.S,0,X.rs); bindTex(u.P,1,X.a0); gl.uniform2f(u.TX,1/X.rs.w,1/X.rs.h); gl.uniform1f(u.AL,al); });
  const cur=X.a1; X.a1=X.a0; X.a0=cur;
  pass(X.bright,X.b1a,u=>{ bindTex(u.S,0,cur); gl.uniform2f(u.TX,1/cur.w,1/cur.h); gl.uniform1f(u.TH,0.35); });
  pass(X.blur,X.b1b,u=>{ bindTex(u.S,0,X.b1a); gl.uniform2f(u.DIR,1.4/X.b1a.w,0); });
  pass(X.blur,X.b1a,u=>{ bindTex(u.S,0,X.b1b); gl.uniform2f(u.DIR,0,1.4/X.b1a.h); });
  pass(X.bright,X.b2a,u=>{ bindTex(u.S,0,X.b1a); gl.uniform2f(u.TX,0.5/X.b1a.w,0.5/X.b1a.h); gl.uniform1f(u.TH,0); });
  pass(X.blur,X.b2b,u=>{ bindTex(u.S,0,X.b2a); gl.uniform2f(u.DIR,2/X.b2a.w,0); });
  pass(X.blur,X.b2a,u=>{ bindTex(u.S,0,X.b2b); gl.uniform2f(u.DIR,0,2/X.b2a.h); });
  // 熱氣扭曲區域：火堆上方投影到畫面
  const c0=project([0,0.36,0.2]), c1=project([0.32,0.36,0.2]), c2=project([0,0.62,0.18]);
  let hz=[0.5,0.5,0.1,0.1];
  if(c0&&c1&&c2) hz=[c0[0]/W, 1-c0[1]/H, Math.max(0.01,Math.abs(c1[0]-c0[0])/W), Math.max(0.01,Math.abs(c0[1]-c2[1])/H)];
  pass(X.comp,null,u=>{ bindTex(u.S,0,cur); bindTex(u.B1,1,X.b1a); bindTex(u.B2,2,X.b2a); gl.uniform1f(u.T,tt); gl.uniform2f(u.R,cv.width,cv.height);
    gl.uniform4f(u.HZ,hz[0],hz[1],hz[2],hz[3]); gl.uniform1f(u.HS,heat); });
}

/* ---------- 3D 火星 ---------- */
const sparks=[];
function spawn(n,power=1,escape=0,at){
  for(let i=0;i<n;i++){
    const esc=rnd()<escape;
    const p0=at?[at[0]+(rnd()-0.5)*0.5,at[1]+rnd()*0.05,at[2]+(rnd()-0.5)*0.1]:[(rnd()-0.5)*0.5, 0.2+rnd()*0.12, 0.15+rnd()*0.15];
    sparks.push({ p:p0,
      v: esc?[(rnd()-0.5)*0.8, 0.5+rnd()*0.9, -(0.7+rnd()*0.9)] : [(rnd()-0.5)*0.15*power, (0.25+rnd()*0.6)*power, (rnd()-0.5)*0.1],
      life:0, max:esc?(2+rnd()*2.5):(0.7+rnd()*1.6), size:0.6+rnd()*1.4, ph:rnd()*6.28, esc, rest:false });
  }
  if(sparks.length>500) sparks.splice(0,sparks.length-500);
}
const sprite=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,200,110,1)');g.addColorStop(0.3,'rgba(255,110,30,.5)');g.addColorStop(1,'rgba(255,60,10,0)');
  x.fillStyle=g;x.fillRect(0,0,64,64);return c;})();
function drawSparks(t,dt){
  const c=fctx; c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,W,H); c.globalCompositeOperation='lighter'; c.lineCap='round';
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i]; s.life+=dt; if(s.life>s.max){ sparks.splice(i,1); continue; }
    const p=s.p, v=s.v;
    if(s.esc){
      if(!s.rest){ v[1]-=2.6*dt; for(let k=0;k<3;k++) p[k]+=v[k]*dt;
        const onHearth=Math.abs(p[0])<0.82 && p[2]>-0.28 && p[2]<0.04, gy=onHearth?-0.01:(p[2]<0.04?-0.09:0);
        { const Rr=1.131, Z=0.871, r=Math.hypot(p[0],p[2]-Z), r0=Math.hypot(p[0]-v[0]*dt,p[2]-v[2]*dt-Z);
          if(r>Rr && r0<=Rr && p[1]<0.28 && Math.abs(Math.atan2(p[0],Z-p[2]))<0.54){ const k=(Rr-0.002)/r; p[0]*=k; p[2]=Z+(p[2]-Z)*k; v[0]*=-0.25; v[2]*=-0.25; } }
        if(p[2]>0 && p[1]<0) { p[1]=0; v[1]*=-0.3; }
        else if(p[1]<gy && v[1]<0){ p[1]=gy; v[1]*=-0.28; v[0]*=0.5; v[2]*=0.5; if(Math.abs(v[1])<0.12) s.rest=true; } }
    } else {
      v[1]+=0.5*dt; v[0]+=Math.sin(t*5+s.ph)*0.5*dt; v[0]*=0.985; for(let k=0;k<3;k++) p[k]+=v[k]*dt;
      if(p[1]>0.62+0.25*Math.max(p[2],0)){ sparks.splice(i,1); continue; }
    }
    if(!visible(p)) continue;
    const a=project(p); if(!a) continue;
    const b=project([p[0]-v[0]*0.025,p[1]-v[1]*0.025,p[2]-v[2]*0.025]);
    const heat=1-s.life/s.max, sz=Math.max(0.6, s.size*0.006/(a[2]*FT)*H*0.5);
    c.strokeStyle=`rgba(255,${(110+140*heat)|0},${(30+120*heat*heat)|0},${Math.min(1,heat*1.5)})`;
    c.lineWidth=sz; c.beginPath(); c.moveTo(a[0],a[1]); if(b) c.lineTo(b[0],b[1]); else c.lineTo(a[0],a[1]+0.1); c.stroke();
    c.globalAlpha=heat*0.45; const g=sz*5; c.drawImage(sprite,a[0]-g,a[1]-g,g*2,g*2); c.globalAlpha=1;
  }
}

/* ---------- 燃燒與添柴 ---------- */
const BURN_SECONDS=12*60;               // 一次添滿大約燒 12 分鐘
let fuel=1, newLog={on:false,y:0,vy:0,landed:true,age:1};
function addLog(){
  if(!S.burn){ flare=Math.min(1.3,flare+0.6); audio.pop(); spawn(40,1.5,0.3); return; }
  fuel=Math.min(1,fuel+0.5);
  if(!newLog.on || newLog.landed && newLog.age>0.6){ newLog={on:true,y:0.5,vy:0,landed:false,age:0}; }
  else { flare=Math.min(1.3,flare+0.4); audio.pop(); spawn(25,1.3,0.2); }
}
function updateBurn(dt){
  if(!S.burn){ fuel=1; newLog.on=false; return; }
  fuel=Math.max(0, fuel-dt/BURN_SECONDS);
  if(newLog.on){
    if(!newLog.landed){
      newLog.vy-=3.2*dt; newLog.y+=newLog.vy*dt;
      if(newLog.y<=0){ newLog.y=0;
        if(newLog.vy<-0.6){ audio.pop(); audio.crackle(0.9); spawn(35,1.4,0.35,[0.0,0.3,0.19]); flare=Math.min(1.3,flare+0.7); newLog.vy*=-0.22; }
        else { newLog.vy=0; newLog.landed=true; } }
    }
    newLog.age=Math.min(1,newLog.age+dt/90);
    if(fuel<0.12) newLog.on=false;
  }
}

/* ---------- 睡眠計時 ---------- */
let sleepEnd=0;
function sleepFade(now){
  if(!sleepEnd) return 1;
  const r=(sleepEnd-now)/1000;
  return Math.max(0, Math.min(1, r/150));
}

/* ---------- 主迴圈 ---------- */
let last=performance.now()/1000, flare=0, t0=rnd()*100, slow=0, fast=0, prevCam=null;
function frame(now){
  const t=now/1000, dt=Math.min(0.05,t-last); last=t;
  if(dt>0.03){ slow++; fast=0; } else if(dt<0.018){ fast++; slow=0; }
  const qb=QUAL[S.quality].q;
  if(slow>40 && glQ>qb*0.6){ glQ=Math.max(qb*0.6,glQ-0.06); slow=0; layout(); }
  if(fast>240 && glQ<qb){ glQ=Math.min(qb,glQ+0.06); fast=0; layout(); }
  setupCamera(t);
  camMoved = prevCam ? Math.hypot(CAM[0]-prevCam[0],CAM[1]-prevCam[1],CAM[2]-prevCam[2]) : 1; prevCam=CAM.slice();
  updateBurn(dt);
  const fade=sleepFade(now); audio.fade=fade;
  const fm=S.burn ? 0.08+0.92*Math.pow(fuel,0.55) : 1;
  flare*=Math.exp(-dt*1.3);
  const base=0.72+0.17*vn(t*0.5)+0.11*vn(t*2.2+40);
  const I=(base*fm+0.15*flare)*(0.06+0.94*fade);
  const act=fm*fade;
  if(rnd()<(6+6*I)*dt*act){ const s=rnd()**2.2; audio.crackle(s*Math.max(0.3,act)); if(s>0.25||rnd()<0.3) spawn(1+Math.floor(s*8*act),0.8+s, s>0.6?0.2:0); }
  if(rnd()<0.09*dt*act){ audio.pop(); spawn(20+Math.floor(rnd()*14),1.3,0.35); flare=Math.min(1.2,flare+0.35); }
  if(rnd()<2*dt*act) spawn(1,0.7);
  audio.rain=S.rain; audio.update(I,flare,dt);
  const NL=[newLog.on?1:0, newLog.y, newLog.age, Math.min(1,0.35+fuel)];
  renderGL(t+t0,I,flare,S.burn?fuel:1,NL,(0.4+0.6*I)*fade);
  drawSparks(t,dt);
  if(panelOpen) updatePanel(now);
  requestAnimationFrame(frame);
}

/* ---------- 介面 ---------- */
const $=id=>document.getElementById(id);
const sndBtn=$('snd'), vol=$('vol'), panel=$('panel');
let panelOpen=false;
const setUI=()=>{ sndBtn.textContent=audio.on?'🔊':'🔇'; };
function updatePanel(now){
  $('fuelRow').style.display=S.burn?'':'none';
  $('fuelBar').style.width=Math.round(fuel*100)+'%';
  if(sleepEnd){ const r=Math.max(0,(sleepEnd-now)/1000); $('sleepLeft').textContent=r>0?`剩 ${Math.floor(r/60)}:${String(Math.floor(r%60)).padStart(2,'0')}`:'已熄滅'; }
  else $('sleepLeft').textContent='';
}
function syncPanel(){
  document.querySelectorAll('[data-q]').forEach(b=>b.classList.toggle('on',b.dataset.q===S.quality));
  $('optBurn').checked=S.burn; $('optSway').checked=S.sway; $('optRain').checked=S.rain; $('optSleep').value=String(S.sleep);
  updatePanel(performance.now());
}
$('gear').onclick=e=>{ e.stopPropagation(); panelOpen=!panelOpen; panel.hidden=!panelOpen; syncPanel(); };
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ S.quality=b.dataset.q; glQ=QUAL[S.quality].q; saveS(); syncPanel(); layout(); });
$('optBurn').onchange=e=>{ S.burn=e.target.checked; if(S.burn){ fuel=1; } saveS(); syncPanel(); };
$('optSway').onchange=e=>{ S.sway=e.target.checked; saveS(); };
$('optRain').onchange=e=>{ S.rain=e.target.checked; if(S.rain&&!audio.ctx){ audio.start(); setUI(); } saveS(); };
$('optSleep').onchange=e=>{ S.sleep=+e.target.value; sleepEnd=S.sleep?performance.now()+S.sleep*60000:0; syncPanel(); };
$('addLog').onclick=()=>{ if(!audio.ctx){ audio.start(); setUI(); } addLog(); };
$('resetView').onclick=()=>{ dragYaw=0; dragPitch=0; };
sndBtn.onclick=()=>{ audio.on?audio.stop():audio.start(); setUI(); };
vol.oninput=()=>{ audio.vol=+vol.value; audio.setVol(); };
const fsT=()=>{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.().catch(()=>{}); };
$('fs').onclick=fsT;
addEventListener('keydown',e=>{ if(e.key==='f'||e.key==='F') fsT(); });

// 拖曳轉視角；沒拖曳的點擊 = 添柴（點在爐火附近）
let down=null;
cv.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY,yaw:dragYaw,pitch:dragPitch,drag:false}; cv.setPointerCapture(e.pointerId);
  if(panelOpen){ panelOpen=false; panel.hidden=true; } });
cv.addEventListener('pointermove',e=>{ if(!down) return; const dx=e.clientX-down.x, dy=e.clientY-down.y;
  if(!down.drag && Math.hypot(dx,dy)>6) down.drag=true;
  if(down.drag){ dragYaw=Math.max(-22,Math.min(22,down.yaw-dx*0.12)); dragPitch=Math.max(-10,Math.min(14,down.pitch+dy*0.08)); } });
cv.addEventListener('pointerup',e=>{
  if(down && !down.drag){
    if(!audio.ctx){ audio.start(); setUI(); }
    const c=project([0,0.25,0.15]), e1=project([0.5,0.25,0.0]);
    if(c&&e1 && Math.hypot(e.clientX-c[0],e.clientY-c[1]) < Math.abs(e1[0]-c[0])*1.1) addLog();
  }
  down=null; });
cv.addEventListener('dblclick',()=>{ dragYaw=0; dragPitch=0; });
let idleT; const wake=()=>{ document.body.classList.remove('idle'); clearTimeout(idleT); idleT=setTimeout(()=>{ if(!panelOpen) document.body.classList.add('idle'); },3000); };
addEventListener('pointermove',wake); addEventListener('pointerdown',wake); wake();
let rz; addEventListener('resize',()=>{ cancelAnimationFrame(rz); rz=requestAnimationFrame(layout); });
initGL();
layout(); syncPanel(); requestAnimationFrame(frame);

})();
</script>
</body>
</html>
