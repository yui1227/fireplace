<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>壁爐</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <canvas id="gl"></canvas>
    <canvas id="fx"></canvas>

    <div id="ui">
      <div id="panel" hidden>
        <div class="row">
          <span>畫質</span>
          <span class="seg">
            <button data-q="low">低</button><button data-q="mid">中</button><button data-q="high">高</button>
          </span>
        </div>
        <label class="row">
          <span>自然燃燒<small>火會慢慢燒完，需要添柴</small></span>
          <input type="checkbox" id="optBurn" />
        </label>
        <div class="row" id="fuelRow">
          <span>柴火</span><span class="bar"><i id="fuelBar"></i></span><button id="addLog">🪵 添柴</button>
        </div>
        <label class="row"><span>鏡頭晃動</span><input type="checkbox" id="optSway" /></label>
        <label class="row"><span>窗外雨聲</span><input type="checkbox" id="optRain" /></label>
        <div class="row">
          <span>睡眠計時 <small id="sleepLeft"></small></span>
          <select id="optSleep">
            <option value="0">關</option>
            <option value="15">15 分</option>
            <option value="30">30 分</option>
            <option value="60">60 分</option>
            <option value="90">90 分</option>
          </select>
        </div>
        <div class="row hint">
          <span>拖曳畫面轉動視角，雙擊回正；點爐火添柴</span><button id="resetView">回正</button>
        </div>
      </div>
      <div class="bar-main">
        <button id="snd" title="聲音">🔇</button>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="音量" />
        <button id="gear" title="設定">⚙</button>
        <button id="fs" title="全螢幕 (F)">⛶</button>
      </div>
    </div>

    <script type="module" src="src/js/main.js"></script>
  </body>
</html>
