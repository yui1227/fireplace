<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>壁爐</title>
<style>
  html,body{margin:0;height:100%;background:#060303;overflow:hidden;font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
  #scene{position:fixed;inset:0;isolation:isolate}
  canvas{position:absolute;left:0;top:0;display:block}
  #flame{mix-blend-mode:screen;pointer-events:none}
  #fg{mix-blend-mode:screen;pointer-events:none}
  #hint{position:fixed;left:50%;bottom:4.5%;transform:translateX(-50%);color:#f3d3b0;font-size:15px;letter-spacing:.08em;
        background:rgba(20,10,6,.55);padding:10px 18px;border-radius:999px;border:1px solid rgba(255,190,130,.18);
        pointer-events:none;transition:opacity 1.2s;white-space:nowrap}
  #ui{position:fixed;right:16px;bottom:16px;display:flex;gap:10px;align-items:center;color:#f3d3b0;font-size:13px;
      background:rgba(20,10,6,.55);padding:8px 12px;border-radius:12px;border:1px solid rgba(255,190,130,.15);
      transition:opacity .8s;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  #ui button{background:none;border:1px solid rgba(255,190,130,.3);color:inherit;border-radius:8px;padding:5px 9px;font:inherit;cursor:pointer}
  #ui button:hover{background:rgba(255,160,90,.12)}
  #ui input{accent-color:#e8813a;width:90px}
  @media (max-width:640px){#hint{bottom:auto;top:5%;font-size:13px}}
  body.idle #ui{opacity:0} body.idle{cursor:none}
</style>
</head>
<body>
<div id="scene">
  <canvas id="bg"></canvas>
  <canvas id="flame"></canvas>
  <canvas id="fg"></canvas>
</div>
<div id="hint">點擊畫面開啟聲音 · 點爐火可以添柴</div>
<div id="ui">
  <button id="snd">🔇 聲音</button>
  <input id="vol" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="音量">
  <button id="fs" title="全螢幕 (F)">⛶</button>
</div>
<script>
(() => {
'use strict';
const bg = document.getElementById('bg'), fg = document.getElementById('fg'), fl = document.getElementById('flame');
const bctx = bg.getContext('2d'), fctx = fg.getContext('2d');
let W = 0, H = 0, dpr = 1, L = null;

/* ---------- 小工具 ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const P = new Float32Array(512); { const r = mulberry32(7); for (let i=0;i<512;i++) P[i]=r(); }
function vn(x){ const i=Math.floor(x), f=x-i, u=f*f*(3-2*f); return P[i&511]+(P[(i+1)&511]-P[i&511])*u; } // 0..1
const rnd = Math.random;

/* ---------- 版面配置（依視窗大小） ---------- */
function layout(){
  W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio||1, 2);
  for (const c of [bg, fg]) { c.width = Math.round(W*dpr); c.height = Math.round(H*dpr); c.style.width = W+'px'; c.style.height = H+'px'; }
  const floorY = H*0.86;
  let FW = Math.min(W*0.8, H*1.05), FH = FW*0.74;
  const maxFH = floorY - H*0.14;
  if (FH > maxFH) { FH = maxFH; FW = FH/0.74; }
  const F = { x:(W-FW)/2, y:floorY-FH, w:FW, h:FH };
  const ow = FW*0.6, oh = FH*0.72;
  const O = { x:(W-ow)/2, y:floorY-FH*0.04-oh, w:ow, h:oh };
  const mantel = { x:F.x-FW*0.07, y:F.y-FH*0.085, w:FW*1.14, h:FH*0.085 };
  const hearth = { x:F.x-FW*0.05, y:floorY-FH*0.04, w:FW*1.1, h:FH*0.11 };
  L = { floorY, F, O, mantel, hearth, sc: ow/600, r: ow*0.11 };

  const lr = mulberry32(99);
  const mkLog = (cx, cy, len, r, rot) => {
    const cracks = [];
    const n = 3 + Math.floor(lr()*3);
    for (let k=0;k<n;k++){
      const pts=[]; let u=-0.45+lr()*0.3, v=-0.7+lr()*1.2; const steps=4+Math.floor(lr()*5);
      for (let s=0;s<steps;s++){ pts.push([u,v]); u+=0.05+lr()*0.12; v+=(lr()-0.5)*0.5; v=Math.max(-0.9,Math.min(0.9,v)); if(u>0.48)break; }
      cracks.push({pts, seed:lr()*100, speed:0.6+lr()*2});
    }
    return { cx:O.x+O.w*cx, cy:O.y+O.h*cy, len:O.w*len, r:O.h*r, rot, cracks };
  };
  L.logs = [ mkLog(0.5,0.80,0.68,0.068,-0.03), mkLog(0.63,0.79,0.42,0.052,-0.42), mkLog(0.42,0.885,0.56,0.062,0.06) ];
  L.embers = [];
  for (let i=0;i<70;i++) L.embers.push({ x:O.x+O.w*(0.16+lr()*0.68), y:O.y+O.h*(0.9+lr()*0.08), s:(6+lr()*16)*L.sc, seed:lr()*100, sp:0.5+lr()*2 });

  sizeGL();
  drawBG();
}

function openingPath(c, O, grow=0){
  const x=O.x-grow, y=O.y-grow, w=O.w+grow*2, h=O.h+grow, r=L.r+grow;
  c.beginPath(); c.moveTo(x,y+h); c.lineTo(x,y+r); c.arcTo(x,y,x+r,y,r); c.lineTo(x+w-r,y); c.arcTo(x+w,y,x+w,y+r,r); c.lineTo(x+w,y+h); c.closePath();
}

/* ---------- 靜態背景（每次縮放視窗重繪） ---------- */
function drawBG(){
  const c = bctx, {F,O,mantel,hearth,floorY,sc} = L, r = mulberry32(1234);
  c.setTransform(dpr,0,0,dpr,0,0);
  // 牆
  let g = c.createLinearGradient(0,0,0,floorY); g.addColorStop(0,'#120b09'); g.addColorStop(1,'#24160f');
  c.fillStyle=g; c.fillRect(0,0,W,floorY);
  const step = Math.max(14, 34*sc);
  for (let x=(W/2)%step - step; x<W; x+=step){ c.fillStyle='rgba(255,215,170,0.022)'; c.fillRect(x,0,step*0.35,floorY); }
  // 地板
  g = c.createLinearGradient(0,floorY,0,H); g.addColorStop(0,'#1d110a'); g.addColorStop(1,'#0c0705');
  c.fillStyle=g; c.fillRect(0,floorY,W,H-floorY);
  let y=floorY, gap=6*Math.max(sc,0.5), row=0;
  while (y<H){ c.fillStyle='rgba(0,0,0,0.45)'; c.fillRect(0,y,W,1);
    const seamStep = 220*Math.max(sc,0.4); for (let x=(row*97)%seamStep; x<W; x+=seamStep*(0.7+r()*0.6)) c.fillRect(x,y,1.2,gap);
    y+=gap; gap*=1.28; row++; }
  // 踢腳板
  c.fillStyle='#0e0806'; c.fillRect(0,floorY-8*Math.max(sc,.5),W,8*Math.max(sc,.5));

  // 磚造外框
  c.save(); c.beginPath(); c.rect(F.x,F.y,F.w,F.h); c.clip();
  c.fillStyle='#2a1f1a'; c.fillRect(F.x,F.y,F.w,F.h);
  const bh = F.h/13, bw = bh*2.5, m = Math.max(1,bh*0.09);
  for (let j=0, by=F.y+F.h-bh; by>F.y-bh; by-=bh, j++){
    for (let bx=F.x-((j%2)?bw/2:0); bx<F.x+F.w; bx+=bw){
      const l = 12+r()*9, s = 30+r()*16, hue = 8+r()*14;
      c.fillStyle=`hsl(${hue},${s}%,${l}%)`; c.fillRect(bx+m,by+m,bw-2*m,bh-2*m);
      c.fillStyle='rgba(255,220,190,0.06)'; c.fillRect(bx+m,by+m,bw-2*m,Math.max(1,bh*0.08));
      c.fillStyle='rgba(0,0,0,0.25)'; c.fillRect(bx+m,by+bh-m-bh*0.1,bw-2*m,bh*0.1);
      for (let k=0;k<4;k++){ c.fillStyle=`rgba(0,0,0,${r()*0.25})`; c.fillRect(bx+m+r()*(bw-3*m), by+m+r()*(bh-3*m), 1+r()*2, 1+r()*2); }
    }
  }
  // 煙燻痕跡
  g = c.createRadialGradient(O.x+O.w/2,O.y,0,O.x+O.w/2,O.y,O.w*0.7);
  g.addColorStop(0,'rgba(0,0,0,0.65)'); g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g; c.fillRect(F.x,F.y,F.w,F.h);
  c.restore();

  // 石材爐口框
  openingPath(c,O,O.w*0.045); c.fillStyle='#3a2e28'; c.fill();
  openingPath(c,O,O.w*0.045); c.lineWidth=2; c.strokeStyle='rgba(0,0,0,0.5)'; c.stroke();
  openingPath(c,O,O.w*0.012); c.fillStyle='#1a120e'; c.fill();

  // 爐膛內部
  c.save(); openingPath(c,O); c.clip();
  c.fillStyle='#050302'; c.fillRect(O.x,O.y,O.w,O.h);
  const I = { x:O.x+O.w*0.15, y:O.y+O.h*0.06, w:O.w*0.7, h:O.h*0.78 };
  // 側牆
  c.fillStyle='#120a07';
  c.beginPath(); c.moveTo(O.x,O.y); c.lineTo(I.x,I.y); c.lineTo(I.x,I.y+I.h); c.lineTo(O.x,O.y+O.h); c.fill();
  c.beginPath(); c.moveTo(O.x+O.w,O.y); c.lineTo(I.x+I.w,I.y); c.lineTo(I.x+I.w,I.y+I.h); c.lineTo(O.x+O.w,O.y+O.h); c.fill();
  // 後牆耐火磚
  const fbh = I.h/11, fbw = fbh*2.2;
  for (let j=0, by=I.y+I.h-fbh; by>I.y-fbh; by-=fbh, j++)
    for (let bx=I.x-((j%2)?fbw/2:0); bx<I.x+I.w; bx+=fbw){
      c.fillStyle=`hsl(${14+r()*10},${25+r()*15}%,${9+r()*6}%)`;
      const x0=Math.max(bx+1,I.x), x1=Math.min(bx+fbw-1,I.x+I.w); if (x1>x0) c.fillRect(x0,by+1,x1-x0,fbh-2);
    }
  // 爐底
  c.fillStyle='#0b0605';
  c.beginPath(); c.moveTo(I.x,I.y+I.h); c.lineTo(I.x+I.w,I.y+I.h); c.lineTo(O.x+O.w,O.y+O.h); c.lineTo(O.x,O.y+O.h); c.fill();
  g = c.createLinearGradient(0,O.y,0,O.y+O.h*0.7); g.addColorStop(0,'rgba(0,0,0,0.95)'); g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g; c.fillRect(O.x,O.y,O.w,O.h);
  // 灰燼
  for (let i=0;i<260;i++){ const ax=O.x+O.w*(0.1+r()*0.8), ay=O.y+O.h*(0.9+r()*0.1);
    c.fillStyle=`rgba(${70+r()*60},${60+r()*50},${55+r()*45},${0.15+r()*0.3})`; c.fillRect(ax,ay,1+r()*3*sc+1,1+r()*2); }
  // 柴架 + 木柴
  c.fillStyle='#000'; c.fillRect(O.x,O.y,O.w,O.h);
  if (false) {
  c.fillStyle='#0a0808';
  c.fillRect(O.x+O.w*0.16,O.y+O.h*0.925,O.w*0.68,O.h*0.018);
  for (const fx of [0.22,0.78]){ c.fillRect(O.x+O.w*fx-O.w*0.012,O.y+O.h*0.84,O.w*0.024,O.h*0.16);
    c.beginPath(); c.arc(O.x+O.w*fx,O.y+O.h*0.84,O.w*0.022,0,Math.PI*2); c.fill(); }
  }
  c.restore();

  // 壁爐台
  c.fillStyle='#000'; c.globalAlpha=0.4; c.fillRect(mantel.x+4,mantel.y+mantel.h,mantel.w-8,mantel.h*0.5); c.globalAlpha=1;
  g = c.createLinearGradient(0,mantel.y,0,mantel.y+mantel.h); g.addColorStop(0,'#5a3c26'); g.addColorStop(0.25,'#3f2817'); g.addColorStop(1,'#24160c');
  c.fillStyle=g; c.fillRect(mantel.x,mantel.y,mantel.w,mantel.h);
  c.fillStyle='rgba(255,210,160,0.12)'; c.fillRect(mantel.x,mantel.y,mantel.w,Math.max(1,mantel.h*0.08));
  for (let i=0;i<14;i++){ c.strokeStyle=`rgba(0,0,0,${0.1+r()*0.15})`; c.lineWidth=1; const yy=mantel.y+mantel.h*(0.2+r()*0.75);
    c.beginPath(); c.moveTo(mantel.x,yy); c.bezierCurveTo(mantel.x+mantel.w*0.3,yy+(r()-.5)*4,mantel.x+mantel.w*0.7,yy+(r()-.5)*4,mantel.x+mantel.w,yy); c.stroke(); }

  // 爐床石板
  g = c.createLinearGradient(0,hearth.y,0,hearth.y+hearth.h); g.addColorStop(0,'#3b302b'); g.addColorStop(0.7,'#2a211d'); g.addColorStop(0.72,'#171110'); g.addColorStop(1,'#110c0a');
  c.fillStyle=g; c.fillRect(hearth.x,hearth.y,hearth.w,hearth.h);
  c.fillStyle='rgba(0,0,0,0.35)'; for (let k=1;k<5;k++) c.fillRect(hearth.x+hearth.w*k/5,hearth.y,1.5,hearth.h*0.7);

  // 暗角
  g = c.createRadialGradient(W/2,O.y+O.h*0.7,Math.min(W,H)*0.25,W/2,O.y+O.h*0.7,Math.max(W,H)*0.85);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.75)');
  c.fillStyle=g; c.fillRect(0,0,W,H);
}

function logXf(c, lg){ c.translate(lg.cx,lg.cy); c.rotate(lg.rot); }
function drawLog(c, lg, r){
  c.save(); logXf(c,lg);
  const hl=lg.len/2, R=lg.r;
  const g = c.createLinearGradient(0,-R,0,R); g.addColorStop(0,'#0c0705'); g.addColorStop(0.35,'#2a1a10'); g.addColorStop(0.7,'#1c110a'); g.addColorStop(1,'#070403');
  c.fillStyle=g; c.beginPath(); c.roundRect(-hl,-R,lg.len,2*R,R*0.6); c.fill();
  for (let i=0;i<10;i++){ const v=(r()*2-1)*R*0.85; c.strokeStyle=`rgba(0,0,0,${0.3+r()*0.4})`; c.lineWidth=1+r()*1.5;
    c.beginPath(); c.moveTo(-hl+r()*lg.len*0.3,v); c.lineTo(hl-r()*lg.len*0.3,v+(r()-.5)*R*0.3); c.stroke(); }
  for (let i=0;i<14;i++){ c.fillStyle=`rgba(0,0,0,${0.3+r()*0.5})`; c.beginPath(); c.ellipse(-hl+r()*lg.len,(r()*2-1)*R*0.7,R*(0.2+r()*0.5),R*(0.1+r()*0.25),0,0,Math.PI*2); c.fill(); }
  // 截面年輪
  const eg = c.createRadialGradient(hl,0,0,hl,0,R); eg.addColorStop(0,'#6b4c30'); eg.addColorStop(0.6,'#4a321e'); eg.addColorStop(0.85,'#231409'); eg.addColorStop(1,'#0a0503');
  c.fillStyle=eg; c.beginPath(); c.ellipse(hl,0,R*0.45,R*0.98,0,0,Math.PI*2); c.fill();
  c.strokeStyle='rgba(20,10,5,0.5)'; c.lineWidth=0.8;
  for (let k=1;k<5;k++){ c.beginPath(); c.ellipse(hl,0,R*0.45*k/5,R*0.98*k/5,0,0,Math.PI*2); c.stroke(); }
  c.restore();
}

/* ---------- WebGL：3D 光線步進壁爐場景 + 體積火焰 + 光暈後製 ---------- */
let gl = null, U = {}, glQ = 0.75, GLX = null;
// 鏡頭位置（單位＝爐口寬；x 左負右正，y 從爐底起算的高度，z 負值＝站在爐口前方的距離）
const CAMERA = [-0.55, 2.4, -2.1];
const COMMON = `precision highp float;
float h1(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
vec2 h2(vec2 p){float n=h1(p);return vec2(n,h1(p+n*17.13+3.1));}
float noise(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
 return mix(mix(h1(i),h1(i+vec2(1,0)),u.x),mix(h1(i+vec2(0,1)),h1(i+vec2(1,1)),u.x),u.y);}
vec3 enc(vec3 c){return c/(1.+c);}
vec3 dec(vec3 c){c=min(c,vec3(.996));return c/(1.-c);}
`;
const VS3 = `attribute vec2 p;varying vec2 vUv;void main(){vUv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;

const SCENE_FS = COMMON + `
uniform vec2 R;uniform float T,I,FL,HP,RAD;uniform vec4 OP;uniform vec3 CAM;
float h13(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float n3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
 return mix(mix(mix(h13(i),h13(i+vec3(1,0,0)),f.x),mix(h13(i+vec3(0,1,0)),h13(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(h13(i+vec3(0,0,1)),h13(i+vec3(1,0,1)),f.x),mix(h13(i+vec3(0,1,1)),h13(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm3(vec3 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n3(p);p=p*2.03+vec3(1.3,7.1,4.7);a*=.5;}return v;}
vec3 voro(vec2 x){vec2 n=floor(x),f=fract(x);float d1=8.,d2=8.;vec2 id=vec2(0);
 for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 g=vec2(i,j);vec2 o=h2(n+g)*.8+.1;vec2 r=g+o-f;float d=dot(r,r);
  if(d<d1){d2=d1;d1=d;id=n+g;}else if(d<d2)d2=d;}
 return vec3(sqrt(d2)-sqrt(d1),h1(id),h1(id+7.7));}
vec3 ember(float t){t=clamp(t,0.,2.);return vec3(1.,.15+.42*t,.02+.16*t*t)*t;}
float openMask(vec2 fc){vec2 q=fc-OP.xy;
 if(q.x<0.||q.y<0.||q.x>OP.z||q.y>OP.w)return 0.;
 if(q.y>OP.w-RAD){
  if(q.x<RAD)return 1.-smoothstep(RAD-1.,RAD+1.,length(q-vec2(RAD,OP.w-RAD)));
  if(q.x>OP.z-RAD)return 1.-smoothstep(RAD-1.,RAD+1.,length(q-vec2(OP.z-RAD,OP.w-RAD)));}
 return 1.;}
void logDef(int i,out vec3 a,out vec3 b,out float r){
 if(i==0){a=vec3(-.38,.095,.36);b=vec3(.39,.105,.33);r=.09;}
 else if(i==1){a=vec3(-.36,.08,.1);b=vec3(.34,.075,.13);r=.078;}
 else if(i==2){a=vec3(-.3,.085,.03);b=vec3(.14,.26,.38);r=.066;}
 else if(i==3){a=vec3(.31,.082,.04);b=vec3(-.12,.27,.37);r=.064;}
 else{a=vec3(-.17,.25,.21);b=vec3(.22,.22,.26);r=.052;}}
float sdCyl(vec3 p,vec3 a,vec3 b,float r){
 vec3 ba=b-a,pa=p-a;float baba=dot(ba,ba),paba=dot(pa,ba);
 float x=length(pa*baba-ba*paba)-r*baba,y=abs(paba-baba*.5)-baba*.5;
 float x2=x*x,y2=y*y*baba;
 float d=(max(x,y)<0.)?-min(x2,y2):(((x>0.)?x2:0.)+((y>0.)?y2:0.));
 return sign(d)*sqrt(abs(d))/baba;}
vec2 map(vec3 p){
 vec2 res=vec2(1e3,-1.);
 for(int i=0;i<5;i++){vec3 a,b;float r;logDef(i,a,b,r);
  float d=sdCyl(p,a,b,r-.01)-.01;
  if(d<res.x)res=vec2(d,float(i));}
 res.x-=.003*sin(p.x*70.+p.z*55.)*sin(p.y*60.+p.x*20.);
 return res;}
vec3 calcN(vec3 p){const vec2 k=vec2(1,-1);float e=.0015;
 return normalize(k.xyy*map(p+k.xyy*e).x+k.yyx*map(p+k.yyx*e).x+k.yxy*map(p+k.yxy*e).x+k.xxx*map(p+k.xxx*e).x);}
vec3 LP(){return vec3(.04*sin(T*1.7)+.02*sin(T*4.1),.3+.03*sin(T*2.3),.25);}
float LI(){return (1.1+.5*FL)*I*(.9+.2*noise(vec2(T*9.,1.)));}
float shadow(vec3 p,vec3 l){vec3 d=l-p;float L=length(d);d/=L;float res=1.,t=.015;
 for(int i=0;i<16;i++){float h=map(p+d*t).x;res=min(res,9.*h/t);t+=clamp(h,.008,.06);if(res<.02||t>L)break;}
 return clamp(res,0.,1.);}
vec3 lightAt(vec3 p,vec3 n,float sh){

    });
  }
  if (sparks.length>600) sparks.splice(0,sparks.length-600);
}

const glowSprite = (() => { const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32); g.addColorStop(0,'rgba(255,190,90,1)'); g.addColorStop(0.3,'rgba(255,110,30,0.6)'); g.addColorStop(1,'rgba(255,60,10,0)');
  x.fillStyle=g; x.fillRect(0,0,64,64); return c; })();

/* ---------- 前景（每格重畫：光暈、炭火、火星） ---------- */
function drawFG(t, I, flare, dt){
  const c=fctx, {O,sc,hearth,F}=L;
  c.setTransform(dpr,0,0,dpr,0,0); c.globalCompositeOperation='source-over'; c.clearRect(0,0,W,H);
  c.globalCompositeOperation='lighter';
  const cx=O.x+O.w/2, cy=O.y+O.h*0.75, R=Math.max(W,H)*0.95;
  // 房間被火光照亮
  let g=c.createRadialGradient(cx,cy,0,cx,cy,R); const a=0.42*I+0.3*flare;
  g.addColorStop(0,`rgba(255,140,60,${0.30*a})`); g.addColorStop(0.18,`rgba(240,100,40,${0.16*a})`); g.addColorStop(0.5,`rgba(200,70,25,${0.05*a})`); g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  // 爐床反光
  g=c.createRadialGradient(cx,hearth.y,0,cx,hearth.y,F.w*0.6);
  g.addColorStop(0,`rgba(255,130,50,${0.35*a})`); g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g; c.fillRect(F.x-F.w*0.1,hearth.y,F.w*1.2,H-hearth.y);
  // 爐膛內光
  c.save(); openingPath(c,O); c.clip();
  g=c.createRadialGradient(cx,O.y+O.h*0.85,0,cx,O.y+O.h*0.85,O.w*0.6);
  g.addColorStop(0,`rgba(255,120,40,${0.08*a})`); g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g; c.fillRect(O.x,O.y,O.w,O.h);
  if (false) for (const e of L.embers){
    const k=vn(t*e.sp+e.seed); c.globalAlpha=Math.min(1,(0.15+0.6*k*k)*(0.5+0.4*I));
    const s=e.s*(0.8+0.4*k); c.drawImage(glowSprite,e.x-s,e.y-s*0.6,s*2,s*1.2);
  }
  c.globalAlpha=1;
  // 木柴上發紅的裂紋
  c.lineCap='round'; c.lineJoin='round';
  if (false) for (const lg of L.logs){
    c.save(); logXf(c,lg);
    for (const cr of lg.cracks){
      const k=vn(t*cr.speed+cr.seed), al=(0.2+0.8*k)*(0.55+0.5*I+flare*0.5);
      c.beginPath(); cr.pts.forEach(([u,v],i)=>{const X=u*lg.len,Y=v*lg.r; i?c.lineTo(X,Y):c.moveTo(X,Y);});
      c.strokeStyle=`rgba(255,70,15,${0.12*al})`; c.lineWidth=lg.r*0.3; c.stroke();
      c.strokeStyle=`rgba(255,${120+80*k|0},40,${0.5*al})`; c.lineWidth=Math.max(0.8,lg.r*0.05); c.stroke();
    }
    c.restore();
  }
  c.restore();

  // 火星
  for (let i=sparks.length-1;i>=0;i--){
    const s=sparks[i]; s.life+=dt; if (s.life>s.max){ sparks.splice(i,1); continue; }
    if (s.esc){
      if (!s.landed){ s.vy+=420*sc*dt; s.x+=s.vx*dt; s.y+=s.vy*dt; if (s.y>=s.landY && s.vy>0){ s.y=s.landY; s.vy*=-0.25; s.vx*=0.4; if (Math.abs(s.vy)<20*sc) s.landed=true; } }
    } else {
      s.vy-=60*sc*dt; s.vx+=Math.sin(t*5+s.ph)*90*sc*dt; s.vx*=0.98; s.x+=s.vx*dt; s.y+=s.vy*dt;
    }
    const f=s.life/s.max, heat=1-f;
    if (!s.esc){ c.save(); openingPath(c,O); c.clip(); }
    const col=`rgba(255,${(110+140*heat)|0},${(30+120*heat*heat)|0},${Math.min(1,heat*1.4)})`;
    c.strokeStyle=col; c.lineWidth=s.size; c.beginPath(); c.moveTo(s.x,s.y); c.lineTo(s.x-s.vx*0.025,s.y-s.vy*0.025); c.stroke();
    c.globalAlpha=heat*0.5; const gs=s.size*5; c.drawImage(glowSprite,s.x-gs,s.y-gs,gs*2,gs*2); c.globalAlpha=1;
    if (!s.esc) c.restore();
  }

  // WebGL 不可用時的備用火焰
  if (!gl){
    c.save(); openingPath(c,O); c.clip();
    for (let k=0;k<14;k++){ const fx=O.x+O.w*(0.3+0.4*vn(k*3.1+t*0.5)), fh=O.h*(0.3+0.35*vn(k*7+t*2))*I, fw=O.w*0.08;
      g=c.createRadialGradient(fx,O.y+O.h*0.8,0,fx,O.y+O.h*0.8-fh*0.4,fh);
      g.addColorStop(0,'rgba(255,200,90,0.35)'); g.addColorStop(1,'rgba(255,60,10,0)'); c.fillStyle=g;
      c.beginPath(); c.ellipse(fx,O.y+O.h*0.8-fh*0.4,fw,fh*0.6,0,0,Math.PI*2); c.fill(); }
    c.restore();
  }
}

/* ---------- 主迴圈：畫面與聲音共用同一組火勢訊號 ---------- */
let last=performance.now()/1000, flare=0, slow=0, fast=0;
function frame(now){
  const t=now/1000, dt=Math.min(0.05, t-last); last=t;
  if (dt>0.026){ slow++; fast=0; } else if (dt<0.018){ fast++; slow=0; }
  if (slow>40 && glQ>0.35){ glQ=Math.max(0.35,glQ-0.1); slow=0; layout(); }
  if (fast>240 && glQ<0.9){ glQ=Math.min(0.9,glQ+0.1); fast=0; layout(); }
  flare*=Math.exp(-dt*1.3);
  const I = 0.72 + 0.17*vn(t*0.5) + 0.11*vn(t*2.2+40) + 0.15*flare;
  // 爆裂事件：同時產生聲音和火星
  if (rnd() < (6+6*I)*dt){ const s=rnd()**2.2; audio.crackle(s); if (s>0.25||rnd()<0.3) spawnSparks(1+Math.floor(s*10), 0.8+s); }
  if (rnd() < 0.09*dt){ audio.pop(); spawnSparks(18+Math.floor(rnd()*14), 1.3, 0.35); flare=Math.min(1.2, flare+0.35); }
  if (rnd() < 2*dt) spawnSparks(1, 0.7);
  audio.update(I, flare);
  renderGL(t, I, flare);
  drawFG(t, I, flare, dt);
  requestAnimationFrame(frame);
}

/* ---------- 互動 ---------- */
const hint=document.getElementById('hint'), sndBtn=document.getElementById('snd'), vol=document.getElementById('vol');
function setSoundUI(){ sndBtn.textContent = audio.on ? '🔊 聲音' : '🔇 聲音'; }
document.getElementById('scene').addEventListener('pointerdown', e => {
  if (!audio.on && !audio.ctx){ audio.start(); setSoundUI(); hint.style.opacity=0; }
  const {O}=L;
  if (e.clientX>O.x && e.clientX<O.x+O.w && e.clientY>O.y && e.clientY<O.y+O.h){
    flare=Math.min(1.3, flare+0.6); audio.pop(); spawnSparks(40, 1.5, 0.3);
  }
});
sndBtn.onclick = () => { audio.on ? audio.stop() : audio.start(); setSoundUI(); hint.style.opacity=0; };
vol.oninput = () => { audio.vol=+vol.value; audio.setVol(); };
const fsToggle = () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(()=>{}); };
document.getElementById('fs').onclick = fsToggle;
addEventListener('keydown', e => { if (e.key==='f'||e.key==='F') fsToggle(); });
let idleT; const wake=()=>{ document.body.classList.remove('idle'); clearTimeout(idleT); idleT=setTimeout(()=>document.body.classList.add('idle'),3000); };
addEventListener('pointermove', wake); addEventListener('pointerdown', wake); wake();
let rz; addEventListener('resize', () => { cancelAnimationFrame(rz); rz=requestAnimationFrame(layout); });

initGL(); layout(); requestAnimationFrame(frame);
})();
</script>
